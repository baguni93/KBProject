plugins {
    id 'java'
    id 'war'
}

group 'org.scoula'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    springVersion = '5.3.37'
    lombokVersion = '1.18.30'
    springSecurityVersion='5.8.13'

}

sourceCompatibility = '1.17'
targetCompatibility = '1.17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // ==================== Spring Framework ====================//

    // IoC 컨테이너, Bean 관리, DI(의존성 주입)
    implementation ("org.springframework:spring-context:${springVersion}")
            { exclude group: 'commons-logging', module: 'common-logging' }

    // Spring MVC (Controller, DispatcherServlet, ViewResolver 등)
    implementation "org.springframework:spring-webmvc:${springVersion}"

    // @Inject 사용을 위한 표준 DI 어노테이션
    implementation 'javax.inject:javax.inject:1'


    // ==================== AOP ====================

    // AOP 런타임 라이브러리 (@Aspect)
    implementation 'org.aspectj:aspectjrt:1.9.20'

    // AOP 프록시 생성 및 위빙 처리
    implementation 'org.aspectj:aspectjweaver:1.9.20'


    // ==================== JSP / Servlet ====================

    // HttpServletRequest, HttpServletResponse 등 Servlet API
    implementation('javax.servlet:javax.servlet-api:4.0.1')

    // JSP 문법 지원 (<%@ page %> 등)
    // Tomcat이 제공하므로 compileOnly
    compileOnly 'javax.servlet.jsp:jsp-api:2.1'

    // JSTL 태그 라이브러리 (<c:forEach>, <c:if> 등)
    implementation 'javax.servlet:jstl:1.2'


    // ==================== Logging ====================

    // Log4j2 API
    implementation 'org.apache.logging.log4j:log4j-api:2.18.0'

    // Log4j2 실제 구현체
    implementation 'org.apache.logging.log4j:log4j-core:2.18.0'

    // SLF4J → Log4j2 연결
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.18.0'


    // ==================== SQL Logging ====================

    // 실행되는 SQL을 콘솔에 출력
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4:1.16'


    // ==================== XML ====================

    // XML 파서 (XML 내 한글 처리 및 XML 분석)
    implementation 'xerces:xercesImpl:2.12.2'


    // ==================== Lombok ====================

    // @Getter @Setter @Data 등 사용
    compileOnly "org.projectlombok:lombok:${lombokVersion}"

    // 컴파일 시 Getter/Setter 코드 자동 생성
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"


    // ==================== JSON ====================

    // Java 객체 ↔ JSON 변환
    // @RequestBody, @ResponseBody 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.4'

    // LocalDate 지원
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.9.4'


    // ==================== Test ====================

    // Spring 테스트 지원
    // ApplicationContext 로딩 등
    testImplementation "org.springframework:spring-test:${springVersion}"

    // 테스트 코드에서 Lombok 사용
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"

    // 테스트 코드 컴파일 시 Lombok 처리
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // JUnit5
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"

    // JUnit 실행기
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // JUnit 엔진
    testRuntimeOnly "org.junit.platform:junit-platform-engine"


    // ==================== Database ====================

    // MySQL JDBC Driver
    // DB 연결 담당
    implementation 'com.mysql:mysql-connector-j:8.1.0'

    // 커넥션 풀 관리
    // DB 연결 재사용
    implementation 'com.zaxxer:HikariCP:2.7.4'

    // @Transactional 처리
    implementation "org.springframework:spring-tx:${springVersion}"

    // JdbcTemplate, DataSource 지원
    implementation "org.springframework:spring-jdbc:${springVersion}"


    // ==================== MyBatis ====================

    // MyBatis 핵심 라이브러리
    // SqlSession, Mapper 지원
    implementation 'org.mybatis:mybatis:3.4.6'

    // Spring + MyBatis 연동
    implementation 'org.mybatis:mybatis-spring:1.3.2'


    // ==================== Utility ====================

    // 파일 복사, 삭제, 읽기 등 IO 작업 편의 기능
    implementation 'commons-io:commons-io:2.16.1'


    // ==================== OpenAI ====================

    // ChatGPT API 호출용 SDK
    //implementation 'com.openai:openai-java:4.6.1'


    // ==================== swagger2 ====================

    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    //RestTemplate가 HTTP 요청을 보낼 때 Apache HttpClient를 사용하도록 하기 위해서
    implementation 'org.apache.httpcomponents:httpcore:4.4.15'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'

    // 웹소켓
    implementation "org.springframework:spring-websocket:${springVersion}"
    implementation "org.springframework:spring-messaging:${springVersion}"
    implementation "org.springframework.integration:spring-integration-stomp:5.5.20"

    // 보안
    implementation("org.springframework.security:spring-security-web:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-config:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-core:${springSecurityVersion}")
    implementation("org.springframework.security:spring-security-taglibs:${springSecurityVersion}")

    //jwt
    implementation("io.jsonwebtoken:jjwt-api:0.11.5")
    runtimeOnly("io.jsonwebtoken:jjwt-impl:0.11.5")
    implementation("io.jsonwebtoken:jjwt-jackson:0.11.5")

    //postconstruct
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

test {
    useJUnitPlatform()
}